name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: release-linux
          - os: macos-latest
            artifact_name: release-macos
          - os: windows-latest
            artifact_name: release-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      # Bundluje nmap binárku (a Npcap inštalátor na Windows) do extraResources/bin/
      # pred buildом — electron-builder ich zahrnie do inštalátora automaticky.
      - name: Bundle nmap (macOS universal binary)
        if: runner.os == 'macOS'
        run: |
          brew install nmap
          arch -x86_64 brew install nmap || true
          mkdir -p extraResources/bin
          ARM="$(brew --prefix nmap)/bin/nmap"
          X64="$(arch -x86_64 brew --prefix nmap 2>/dev/null)/bin/nmap"
          if [ -f "$X64" ]; then
            lipo -create -output extraResources/bin/nmap "$ARM" "$X64"
          else
            cp "$ARM" extraResources/bin/nmap
          fi
          chmod +x extraResources/bin/nmap

      - name: Bundle nmap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y nmap
          mkdir -p extraResources/bin
          cp "$(which nmap)" extraResources/bin/nmap
          chmod +x extraResources/bin/nmap

      - name: Bundle nmap + Npcap installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extraResources\bin | Out-Null
          Invoke-WebRequest "https://nmap.org/dist/nmap-7.95-setup.exe" -OutFile nmap-setup.exe
          Start-Process nmap-setup.exe -ArgumentList "/S","/D=$((Get-Location).Path)\nmap-tmp" -Wait
          Copy-Item "nmap-tmp\nmap.exe" "extraResources\bin\"
          Invoke-WebRequest "https://npcap.com/dist/npcap-1.79.exe" -OutFile "extraResources\bin\Npcap-installer.exe"

      # electron-builder len zostavuje; vydanie vytvara az job "release" nizsie
      # (inak electron-builder vytvori vlastne vydanie a subory su tam 2x).
      - name: Build distributable app
        run: npm run dist -- --publish never

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Show downloaded files
        run: find release-artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
          body_path: release-notes.md
          generate_release_notes: true
          overwrite_files: true
